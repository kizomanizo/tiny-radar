<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tiny Radar</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <header class="top">
    <div class="brand">
      <div class="brand-row">
        <span id="live-dot" class="live-dot wait" aria-hidden="true"></span>
        <h1>Tiny Radar</h1>
      </div>
      <p id="status" role="status">Starting</p>
      <p id="updated" class="updated"></p>
    </div>
    <div class="controls">
      <div class="range" role="group" aria-label="Scan radius in nautical miles">
        <button type="button" data-nm="20">20</button>
        <button type="button" data-nm="40" aria-pressed="true">40</button>
        <button type="button" data-nm="80">80</button>
        <span class="unit">nm</span>
      </div>
      <button type="button" id="recenter">Center</button>
      <button type="button" id="place" aria-pressed="false" title="Click the map to move the scanner">Pin</button>
    </div>
  </header>

  <p id="gate" class="gate">Requesting this device’s location…</p>

  <article id="detail" class="detail" hidden>
    <button type="button" id="detail-close" class="detail-close" aria-label="Close details">Close</button>
    <p id="detail-op" class="detail-op"></p>
    <p id="detail-sub" class="detail-sub"></p>
    <p id="detail-route" class="detail-route" hidden></p>
    <dl class="facts">
      <div>
        <dt>Altitude</dt>
        <dd id="detail-alt"></dd>
      </div>
      <div>
        <dt>Speed</dt>
        <dd id="detail-gs"></dd>
      </div>
      <div>
        <dt>Heading</dt>
        <dd id="detail-hdg"></dd>
      </div>
    </dl>
    <p id="detail-progress" class="detail-progress" hidden></p>
  </article>

  <footer class="bottom">
    <div class="plate">
      <p class="legend">
        <span><i class="swatch flown" aria-hidden="true"></i> Flown</span>
        <span><i class="swatch ahead" aria-hidden="true"></i> Ahead</span>
      </p>
      <p class="credits">
        Positions
        <a id="source-link" href="https://adsb.fi/" target="_blank" rel="noreferrer">adsb.fi</a>
        · Routes
        <a href="https://adsb.lol/" target="_blank" rel="noreferrer">adsb.lol</a>
        · Names
        <a href="https://openflights.org/data.html" target="_blank" rel="noreferrer">OpenFlights</a>
      </p>
    </div>
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/app.js"></script>
</body>
</html>
